<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>DeskWrap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #0f1115;
      color: #e6e8eb;
      display: flex; align-items: center; justify-content: center;
      height: 100vh;
    }
    .card { text-align: center; max-width: 520px; padding: 40px; }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 24px; border-radius: 16px;
      background: linear-gradient(135deg, #4f8cff, #7c5cff);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 800; color: #fff;
    }
    h1 { font-size: 20px; margin-bottom: 10px; }
    p { color: #9aa3af; font-size: 14px; line-height: 1.7; margin-bottom: 8px; }
    code {
      background: #1c2027; padding: 2px 8px; border-radius: 6px;
      color: #8fd3ff; font-size: 13px;
    }
    .status { margin-top: 20px; font-size: 13px; color: #f5b04a; min-height: 18px; }
    .status.ok { color: #6fd38c; }
    .btn {
      margin-top: 24px; padding: 10px 28px; border: none; border-radius: 8px;
      background: #4f8cff; color: #fff; font-size: 14px; cursor: pointer;
    }
    .btn:hover { background: #3d7aef; }
    .btn.hidden { display: none; }
    .spinner {
      width: 28px; height: 28px; margin: 24px auto 0;
      border: 3px solid #2a2f38; border-top-color: #4f8cff;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    .spinner.hidden { display: none; }
    .deps-box {
      text-align: left; margin-top: 18px; padding: 12px 14px;
      background: #171b22; border: 1px solid #262c36; border-radius: 8px;
      font-size: 12.5px; color: #c9d1db; line-height: 1.8;
      max-height: 180px; overflow: auto; display: none;
    }
    .deps-box.show { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">D</div>
    <h1 id="title">正在启动服务…</h1>
    <p id="sub">正在等待本地服务就绪</p>
    <p>地址：<code id="url">…</code></p>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status"></div>
    <div class="deps-box" id="depsBox"></div>
    <button class="btn hidden" id="installBtn">📦 安装依赖</button>
    <button class="btn hidden" id="retry">重试</button>
  </div>
  <script>
    // window.__DW_INIT__ is injected by the Go side before this page loads:
    // { url, appName, error?: "timeout", depsCmd?: "pnpm install", rtMissing?: "需要安装 Node.js: ..." }
    var init = window.__DW_INIT__ || {};
    var url = init.url || '';
    var appName = init.appName || 'DeskWrap';
    var failed = init.error === 'timeout';
    var depsCmd = init.depsCmd || '';
    var rtMissing = init.rtMissing || '';
    var installBtn = document.getElementById('installBtn');
    var depsBox = document.getElementById('depsBox');

    document.title = appName;
    document.getElementById('url').textContent = url;

    // ---------- runtime missing state ----------
    if (rtMissing) {
      document.getElementById('title').textContent = '缺少运行时';
      document.getElementById('sub').textContent = '该服务需要额外的运行时环境才能启动。';
      document.getElementById('spinner').classList.add('hidden');
      document.getElementById('status').textContent = rtMissing;
      // Auto-select the hint text for easy copy.
      var statusEl = document.getElementById('status');
      statusEl.style.userSelect = 'text';
      statusEl.style.cursor = 'text';
      statusEl.title = '点击可选中复制';
    }

    // ---------- deps missing state ----------
    if (depsCmd) {
      document.getElementById('title').textContent = '需要安装依赖';
      document.getElementById('sub').textContent = '首次运行：请先安装项目依赖。';
      document.getElementById('spinner').classList.add('hidden');
      document.getElementById('status').textContent = '安装命令：' + depsCmd;
      depsBox.classList.add('show');
      depsBox.textContent = '';
      installBtn.classList.remove('hidden');
      installBtn.onclick = async function () {
        installBtn.disabled = true;
        installBtn.textContent = '⏳ 安装中…';
        depsBox.textContent = '';
        document.getElementById('status').textContent = '';
        // __dw_installDeps is bound by the Go side.
        var res = await window.deskwrap.installDeps();
        if (res && res.ok) {
          document.getElementById('title').textContent = '✅ 依赖安装完成';
          document.getElementById('sub').textContent = '正在启动服务…';
          document.getElementById('spinner').classList.remove('hidden');
          installBtn.classList.add('hidden');
        } else {
          document.getElementById('title').textContent = '安装失败';
          document.getElementById('status').textContent = (res && res.error) || '安装命令执行失败，请手动安装。';
          installBtn.disabled = false;
          installBtn.textContent = '📦 重试安装';
        }
      };
    }

    // ---------- timeout state ----------
    if (failed) {
      document.getElementById('title').textContent = '服务启动超时';
      document.getElementById('status').textContent = '请检查服务日志，或点击重试。';
      document.getElementById('spinner').classList.add('hidden');
      var btn = document.getElementById('retry');
      btn.classList.remove('hidden');
      btn.onclick = async function () {
        btn.disabled = true;
        document.getElementById('status').textContent = '正在重启服务…';
        var ok = await window.deskwrap.retry();
        if (!ok) {
          document.getElementById('status').textContent = '服务仍然无法启动，请检查配置。';
          btn.disabled = false;
        }
      };
    }
  </script>
</body>
</html>
